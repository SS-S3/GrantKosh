# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Free plan: the service sleeps after 15 min without inbound traffic. Keep it awake with an external
# monitor that requests /api/health every 5 min (see DEPLOY.md, "Keep the free service awake").
# One service running all month uses ~744 of the 750 free instance hours per workspace.
# For no sleep and no shared-hours limit, set `plan: starter` (paid).
services:
  - name: grantkosh
    type: web
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: npm ci --no-audit --no-fund && npm run build:prod
    startCommand: npm start
    healthCheckPath: /api/health
    # Redeploys on every push, including the daily data commit from .github/workflows/scrape.yml.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false # prompted once in the dashboard; never stored in the repo
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite,gemini-2.5-flash
      - key: TRUST_PROXY
        value: "1"
      - key: ADVISOR_PER_IP_LIMIT
        value: "12"
      - key: ADVISOR_DAILY_LIMIT
        value: "400"
