name: Scrape and deploy
on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "data/curated/**"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape
        if: github.event_name != 'push'
        env:
          TZ: Asia/Kolkata
        # Exit code 1 means some source failed and kept its last good data; publish anyway.
        run: npm run scrape || [ $? -eq 1 ]
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "grantkosh-bot"
          git config user.email "grantkosh-bot@users.noreply.github.com"
          git add web/public/data data/state
          git diff --cached --quiet || git commit -m "data: daily scrape $(date +%F)"
          git push
      # Vercel, Render and the Oracle image (image.yml) redeploy from the data commit above.
      # There is no static-only copy: the directory needs the API, so the data files are never published.
